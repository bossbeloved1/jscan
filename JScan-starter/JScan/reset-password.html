
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Reset Password — JScan</title>

  <link rel="icon" type="image/svg+xml" href="css/logoextension.svg">
  <link rel="stylesheet" href="css/style.css">

  <style>
    /* BRAND LOGO */

    .brand-logo {
      width: 50px;
      height: 50px;
      object-fit: contain;
      display: block;
      background: transparent;
      border: none;
      box-shadow: none;
      padding: 0;
    }

    /* RESET PASSWORD PAGE */

    .auth-placeholder {
      max-width: 460px;
      width: 100%;
      margin: 0 auto;
      padding: 15px 5px;
    }

    #resetPasswordForm {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    #resetPasswordForm .field-label {
      display: block;
      font-weight: 600;
      margin-top: 10px;
      color: var(--text);
    }

    #resetPasswordForm input[type="password"],
    #resetPasswordForm input[type="text"] {
      width: 100%;
      min-height: 54px;
      padding: 14px 17px;
      border: 1px solid #d8e3f2;
      border-radius: 12px;
      background: #f2f6fc;
      color: #17243a;
      font-size: 15px;
      outline: none;
      transition: border-color .2s ease,
                  box-shadow .2s ease,
                  background .2s ease;
      box-sizing: border-box;
    }

    #resetPasswordForm input[type="password"]:focus,
    #resetPasswordForm input[type="text"]:focus {
      border-color: #3984f7;
      background: #fff;
      box-shadow: 0 0 0 4px rgba(59, 130, 246, .13);
    }

    #resetPasswordForm label:has(#showPassword) {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 0;
      cursor: pointer;
    }

    #showPassword {
      width: 17px;
      height: 17px;
      accent-color: #2563eb;
      cursor: pointer;
    }

    #resetPasswordBtn {
      width: 100%;
      min-height: 54px;
      margin-top: 12px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #2563eb, #3b82f6);
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: .2px;
      box-shadow: 0 7px 18px rgba(37, 99, 235, .22);
      cursor: pointer;
      transition: transform .2s ease,
                  box-shadow .2s ease,
                  opacity .2s ease;
    }

    #resetPasswordBtn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 10px 24px rgba(37, 99, 235, .3);
    }

    #resetPasswordBtn:active:not(:disabled) {
      transform: translateY(0);
    }

    #resetPasswordBtn:disabled {
      opacity: .65;
      cursor: not-allowed;
    }

    #resetMessage {
      min-height: 20px;
      line-height: 1.6;
      margin: 8px 0;
    }

    /* DARK MODE */

    html[data-theme="dark"] #resetPasswordForm input[type="password"],
    html[data-theme="dark"] #resetPasswordForm input[type="text"] {
      background: #142238;
      border-color: #30445f;
      color: #f1f5f9;
    }

    html[data-theme="dark"] #resetPasswordForm input[type="password"]:focus,
    html[data-theme="dark"] #resetPasswordForm input[type="text"]:focus {
      background: #192b45;
      border-color: #60a5fa;
      box-shadow: 0 0 0 4px rgba(59, 130, 246, .18);
    }

    html[data-theme="dark"] #resetPasswordForm .field-label {
      color: #e2e8f0;
    }

    html[data-theme="dark"] #resetPasswordForm .fine-print {
      color: #b8c7da;
    }

    @media (max-width: 480px) {
      .auth-placeholder {
        padding: 10px 0;
      }

      #resetPasswordForm input[type="password"],
      #resetPasswordForm input[type="text"] {
        min-height: 52px;
      }
    }
  </style>
</head>

<body>

  <header class="site-header">
    <a class="brand" href="index.html">
      <img src="css/logo.png" alt="JScan Logo" class="brand-logo">
      <span>JScan</span>
    </a>

    <nav class="main-nav">
      <a href="index.html">Home</a>
      <a href="tools.html">Explore tools</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
    </nav>

    <div class="header-actions">
      <button class="icon-btn" data-theme-toggle type="button" aria-label="Toggle theme">☾</button>
      <a class="btn btn-ghost" href="login.html">Log in</a>
      <a class="btn btn-primary" href="register.html">Create account</a>
    </div>
  </header>

  <main class="wrap page-main">

    <div class="breadcrumb">
      <a href="index.html">Home</a>
      <span>/</span>
      <span>Reset Password</span>
    </div>

    <div class="page-intro">
      <span class="eyebrow">ACCOUNT SECURITY</span>
      <h1>Reset your password</h1>
      <p>Create a new password for your JScan account.</p>
    </div>

    <section class="panel">
      <div class="auth-placeholder">

        <form id="resetPasswordForm">

          <label class="field-label" for="newPassword">
            New Password
          </label>

          <input
            type="password"
            id="newPassword"
            name="newPassword"
            placeholder="Enter your new password"
            minlength="8"
            autocomplete="new-password"
            required
          >

          <label class="field-label" for="confirmPassword">
            Confirm New Password
          </label>

          <input
            type="password"
            id="confirmPassword"
            name="confirmPassword"
            placeholder="Confirm your new password"
            minlength="8"
            autocomplete="new-password"
            required
          >

          <label>
            <input type="checkbox" id="showPassword">
            <span>Show password</span>
          </label>

          <p class="fine-print">
            Your password must contain at least 8 characters.
          </p>

          <p id="resetMessage" role="status" aria-live="polite"></p>

          <button type="submit" id="resetPasswordBtn">
            Update Password
          </button>

          <a href="login.html" class="btn btn-ghost" style="text-align:center; margin-top:8px;">
            Back to Login
          </a>

        </form>

      </div>
    </section>

  </main>

  <footer class="site-footer wrap">
    <a class="brand" href="index.html">
      <img src="css/logo.png" alt="JScan Logo" class="brand-logo">
      <span>JScan</span>
    </a>
    <span>© 2026 JScan</span>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/main.js"></script>
  <script src="js/reset-password.js"></script>

</body>
</html>
